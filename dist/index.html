<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/index-C-c37yAi.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DOLoqgmJ.css">
</head>
<body>
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Initializing Command Center...</div>
    </div>

    <div id="app">
        <!-- Top Dashboard Bar -->
        <header class="top-dashboard" id="top-dashboard"></header>

        <!-- Tab Bar -->
        <nav class="tab-bar" id="tab-bar" role="tablist"></nav>

        <!-- Main Content Area -->
        <main class="main-content" id="main-content">
            <!-- Left Sidebar -->
            <aside class="sidebar-left" id="sidebar-left" role="complementary">
                <div class="sidebar-section">
                    <h3 class="sidebar-title">WORKSTATIONS</h3>
                    <div class="workstation-list" id="workstation-list"></div>
                </div>
                <div class="sidebar-section">
                    <h3 class="sidebar-title">QUICK ACTIONS</h3>
                    <div class="quick-actions" id="quick-actions"></div>
                </div>
            </aside>

            <!-- 3D Workspace (Center) -->
            <section class="workspace-3d" id="workspace-3d">
                <div class="canvas-wrapper">
                    <div id="canvas-container"></div>
                    <div class="canvas-overlay" id="canvas-overlay"></div>
                </div>
            </section>

            <!-- Right Activity Panel -->
            <aside class="panel-right" id="panel-right" role="complementary">
                <div class="panel-header">
                    <h3>LIVE ACTIVITY</h3>
                    <button class="panel-action-btn" id="clear-activity" aria-label="Clear activity log">Clear</button>
                </div>
                <div class="activity-list" id="activity-list"></div>
                
                <div class="panel-divider"></div>
                
                <div class="panel-header">
                    <h3>EXECUTION STATUS</h3>
                </div>
                <div class="execution-status" id="execution-status">
                    <div class="execution-item">
                        <span class="execution-label">Current Task</span>
                        <span class="execution-value" id="exec-task">No active task</span>
                    </div>
                    <div class="execution-item">
                        <span class="execution-label">Model</span>
                        <span class="execution-value" id="exec-model">—</span>
                    </div>
                    <div class="execution-item">
                        <span class="execution-label">Status</span>
                        <span class="execution-value" id="exec-status">Idle</span>
                    </div>
                    <div class="execution-item">
                        <span class="execution-label">Progress</span>
                        <div class="execution-progress">
                            <div class="execution-progress-bar" id="exec-progress-bar"></div>
                        </div>
                        <span class="execution-value" id="exec-progress-text">0%</span>
                    </div>
                </div>
            </aside>
        </main>

        <!-- Tab Panels (Overlay) -->
        <div class="tab-panels-container" id="tab-panels-container"></div>
    </div>

</body>
</html>
